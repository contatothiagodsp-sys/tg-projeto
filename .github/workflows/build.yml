name: Build

# Verificação de qualidade: compila (com avisos de nulidade tratados como erro) e gera o instalador de teste em
# pull requests e em branches que não são a main. A main é publicada pelo publicar.yml, que faz o mesmo e cria a release.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compilar (Release)
        run: dotnet build tHgOptimization.csproj -c Release -nologo

      - name: Testar
        run: dotnet test tests/ThgOptimization.Tests/ThgOptimization.Tests.csproj -c Release -nologo --logger "trx;LogFileName=testes.trx" --results-directory TestResults

      # Totais e nomes do que não passou, no log: dá para conferir o resultado sem baixar o .trx.
      - name: Resumo dos testes
        if: ${{ always() }}
        shell: pwsh
        run: |
          $trx = Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Host "Sem resultado de testes."; exit 0 }
          [xml]$x = Get-Content $trx.FullName
          $c = $x.TestRun.ResultSummary.Counters
          Write-Host "TESTES total=$($c.total) executados=$($c.executed) aprovados=$($c.passed) reprovados=$($c.failed) ignorados=$([int]$c.total - [int]$c.executed)"
          foreach ($t in @($x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' })) { Write-Host "NAO-APROVADO [$($t.outcome)] $($t.testName)" }

      # A janela de verdade, com todas as páginas e o tHg Intelligence desenhando um diagnóstico. O runner não tem GPU nem sensores,
      # então este passo não bloqueia: o relatório no log diz o que abriu e o que falhou.
      - name: Janela real (não bloqueia)
        continue-on-error: true
        shell: pwsh
        env:
          THG_WINDOW_TEST: '1'
          THG_RENDER_DIR: ${{ runner.temp }}\janela
        run: |
          New-Item -ItemType Directory -Force $env:THG_RENDER_DIR | Out-Null
          dotnet test tests/ThgOptimization.Tests/ThgOptimization.Tests.csproj -c Release -nologo --no-build --filter "FullyQualifiedName~MainWindowLiveTests"
          $codigo = $LASTEXITCODE
          Get-Content "$env:THG_RENDER_DIR\janela-relatorio.txt" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "JANELA $_" }
          exit $codigo

      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: janela-real
          path: ${{ runner.temp }}/janela
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar (arquivo único)
        run: dotnet publish tHgOptimization.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\tHgOptimization.iss "/DSourceExe=..\dist\tHgOptimization.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Tamanho, SHA-256 e situação da assinatura de cada arquivo gerado, para conferir com o que foi publicado.
      - name: Resumo dos artefatos
        continue-on-error: true
        if: ${{ success() }}
        shell: pwsh
        run: |
          Get-ChildItem dist\tHgOptimization.exe, dist\tHgOptimization-Setup*.exe, tHgOptimization-portatil.zip -ErrorAction SilentlyContinue | ForEach-Object {
            $sig = if ($_.Extension -eq '.exe') { (Get-AuthenticodeSignature $_.FullName).Status } else { 'n/a' }
            Write-Host "ARTEFATO $($_.Name) bytes=$($_.Length) sha256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash) assinatura=$sig"
          }
          $v = (Get-Item dist\tHgOptimization.exe).VersionInfo
          Write-Host "VERSAO produto=$($v.ProductVersion) arquivo=$($v.FileVersion)"

      # O mesmo passo do publicar.yml, para a geração do SBOM ser exercitada antes de chegar à main. Não bloqueia.
      - name: SBOM (ensaio)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet-CycloneDX tHgOptimization.csproj -o sbom -fn tHgOptimization-sbom.json -F Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "SBOM bytes=$((Get-Item sbom\tHgOptimization-sbom.json).Length) sha256=$((Get-FileHash sbom\tHgOptimization-sbom.json -Algorithm SHA256).Hash)"

      - uses: actions/upload-artifact@v6
        with:
          name: tHgOptimization-teste
          path: |
            dist/tHgOptimization.exe
            dist/tHgOptimization-Setup-*.exe
          retention-days: 7
